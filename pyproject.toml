[project]
name = "relatics-extractor"
version = "0.2.2"
description = "A package that enables fast and easy ETL processing of a Relatics workspace."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "pandas>=3.0.3",
    "pyarrow>=25.0.1",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
]

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"
