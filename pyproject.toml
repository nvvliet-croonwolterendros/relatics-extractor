[project]
name = "relatics-connector"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "notebook>=7.6.2",
    "pandas>=3.0.3",
    "pyarrow>=25.0.1",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
]

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"