[project]
name = "relatics-extractor"
version = "0.2.0"
description = "A package that enables fast and easy ETL processing of a Relatics workspace."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "notebook>=7.6.2",
    "pandas>=3.0.3",
    "pyarrow>=25.0.1",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
]
[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"
