site_name: Relatics Tooliit Documentation
theme:
  name: material

markdown_extensions:
  - admonition
  # - pymdownx.details
  # - pymdownx.superfences

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true

nav:
  - Home: index.md
  - Getting Started:
    - Introduction: getting_started/index.md
    - Installation: getting_started/installation.md
    - Setting up Relatics: getting_started/settinguprelatics.md
  - Relatics Extractor: extraction_service.md
  - Relatics Client: client.md
  - XML parser: xml_parser.md